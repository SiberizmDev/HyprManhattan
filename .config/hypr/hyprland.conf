# █▀▄▀█ █▀█ █▄░█ █ ▀█▀ █▀█ █▀█
# █░▀░█ █▄█ █░▀█ █ ░█░ █▄█ █▀▄

# See https://wiki.hyprland.org/Configuring/Monitors/

monitor=,preferred,auto,1

$mainMod = SUPER
$key = tab
$mod = super
$localBin = $HOME/.local/bin
$scriptsDir = $HOME/.config/hypr/scripts
$hyprDir = $HOME/.config/hypr
$term = alacritty 
$mail = bluemail
$dc = discord
$menu = sh .config/bspwm/scripts/rofi_launcher
$power = sh .config/bspwm/scripts/rofi_powermenu
$runner = sh .config/bspwm/scripts/rofi_runner
$idle_lock = sh .config/hypr/scripts/lockscreen
$recorder = $scriptsDir/wfrecord-start
$recorders = $scriptsDir/wfrecord-stop
$fullmenu = $scriptsDir/fullmenu
$volume = sh $scriptsDir/volume
$backlight = $scriptsDir/brightness
$screenshot = $scriptsDir/screenshot
$lock = $scriptsDir/lockscreen
$colorpicker = $scriptsDir/colorpicker
$wofi_beats = $scriptsDir/wofi-beats
$files = thunar 
$browser = zen-browser 
$editor = code
$rofistyle = -theme ~/.config/rofi/launchers/type-1/style-7.rasi
$rofi_music = ~/.config/hypr/scripts/rofi_music
$skype = flatpak run com.skype.Client


# █▀▀ █▄░█ █░█
# ██▄ █░▀█ ▀▄▀

# See https://wiki.hyprland.org/Configuring/Environment-variables/

# Some default env vars
env = XCURSOR_SIZE,24
env = wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = CLUTTER_BACKEND,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = MOZ_ENABLE_WAYLAND,1


# █░░ ▄▀█ █░█ █▄░█ █▀▀ █░█
# █▄▄ █▀█ █▄█ █░▀█ █▄▄ █▀█

# See https://wiki.hyprland.org/Configuring/Keywords/

exec-once = $scriptsDir/startup

exec-once = swaybg -m fill -i $HOME/.wallpapers/warrior.jpg
#exec-once = mpvpaper -vs -o "no-audio loop" eDP-1 .wallpapers/owl.gif
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = /usr/lib/kdeconnectd
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = /usr/lib/xdg-desktop-portal
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = $scriptsDir/portal
exec-once = hyprswitch init --show-title --size-factor 4.4 --workspaces-per-row 5 --custom-css .config/hypr/hyprswitch.css
exec-once = $skype & ferdium & spotify & thunderbird
exec-once = waybar & wl-paste --watch cliphist store & dunst
# & $idle_lock
# nwg-dock-hyprland -d --i 32
# exec-once = waybar --bar main-bar --log-level error --config ~/.config/hypr/waybar/siberizm/configtopnew --style ~/.config/hypr/waybar/siberizm/styletopnew.css

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
  # qwerty
  kb_layout = tr

  kb_variant =
  kb_model =
  kb_options =
  kb_rules =
  repeat_rate = 70
  repeat_delay = 500

  follow_mouse = 1
  numlock_by_default = 1

  touchpad {
    natural_scroll = true
    tap-to-click = true
    drag_lock = true
    disable_while_typing = true
  }

  #sensitivity = 0.0 # -1.0 - 1.0, 0 means no modificatrion
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
}

binds {
  workspace_back_and_forth = true
}

general {
  # See https://wiki.hyprland.org/Configuring/Variables/ for more

  gaps_in = 5
  gaps_out = 10
  border_size = 2
  allow_tearing = false

  #col.active_border = rgb(353B3F) rgb(A08DB1) rgb(353B3F)
   col.active_border = rgb(B4A1DB) rgb(DB86BA) 45deg
   col.inactive_border = rgb(2A323B)
   resize_on_border = true

  # layout = master
  layout = dwindle
}

group {
    col.border_active = rgb(B4A1DB) rgb(DB86BA) 90deg
    col.border_inactive = rgba(2A323Bcc) rgba(B4A1DBcc) 45deg
    col.border_locked_active = rgba(ca9ee6ff) rgba(f2d5cfff) 45deg
    col.border_locked_inactive = rgba(b4befecc) rgba(6c7086cc) 45deg
}


layerrule = blur,rofi
layerrule = blur, waybar

decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1 
    inactive_opacity = 1

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 10
        passes = 5
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.1696 
    }
}

animations {

	enabled = true

 # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = overshot, 0.13, 0.99, 0.29, 1.1 
	  bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = myBezier2, 0.10, 0.9, 0.1, 1.05

    # animation = windows, 1, 7, myBezier, slide
    # animation = windowsOut, 1, 7, myBezier, slide
    # animation = border, 1, 7, default
    # animation = fade, 1, 7, default
    # animation = workspaces, 1, 6, default

    animation = windows, 1, 5, default 
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, default  

}

dwindle {
  # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
  pseudotile = true
  preserve_split = true
}

master {
  # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
   new_status = master
  mfact = 0.5
}

gestures {
  # See https://wiki.hyprland.org/Configuring/Variables/ for more
   workspace_swipe = true
	workspace_swipe_fingers = 3
	workspace_swipe_distance = 300
	workspace_swipe_invert = true
	workspace_swipe_min_speed_to_force = 30
	workspace_swipe_cancel_ratio = 0.5
	workspace_swipe_create_new = true
	workspace_swipe_forever = false
}


# █▀ █▀█ █░█ █▀█ █▀▀ █▀▀
# ▄█ █▄█ █▄█ █▀▄ █▄▄ ██▄

source = ~/.config/hypr/hyprland_conffiles/keybindings.conf
source = ~/.config/hypr/hyprland_conffiles/windowrules.conf
